# A calver layout with no year.
apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: gallery
  namespace: argocd
spec:
  applicationRefs:
    - namePattern: demo
      images:
        - alias: demo
          imageName: ghcr.io/liskl-networks/k8s-notes-examples/image-updater-demo:MAJOR.MINOR.MICRO
          commonUpdateSettings:
            updateStrategy: calver
