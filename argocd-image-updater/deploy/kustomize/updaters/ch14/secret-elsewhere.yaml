# The git Secret named in another namespace.
apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: gallery
  namespace: argocd
spec:
  writeBackConfig:
    method: git:secret:default/iu-git-ssh
    gitConfig:
      repository: git@github.com:liskl-networks/k8s-notes-examples.git
      branch: argocd-image-updater-lab
  applicationRefs:
    - namePattern: demo
      images:
        - alias: demo
          imageName: ghcr.io/liskl-networks/k8s-notes-examples/image-updater-demo:1.x
