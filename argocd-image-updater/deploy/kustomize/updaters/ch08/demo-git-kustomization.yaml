# The same, writing the overlay's own kustomization.yaml.
apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: demo
  namespace: argocd
spec:
  writeBackConfig:
    method: git:secret:argocd/iu-git-ssh
    gitConfig:
      repository: git@github.com:liskl-networks/k8s-notes-examples.git
      branch: argocd-image-updater-lab
      writeBackTarget: kustomization:.
  applicationRefs:
    - namePattern: demo
      images:
        - alias: demo
          imageName: ghcr.io/liskl-networks/k8s-notes-examples/image-updater-demo:1.x
