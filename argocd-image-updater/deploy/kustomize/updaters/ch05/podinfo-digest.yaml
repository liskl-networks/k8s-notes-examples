# digest watches one tag and writes it with its digest.
apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: podinfo
  namespace: argocd
spec:
  applicationRefs:
    - namePattern: podinfo
      images:
        - alias: podinfo
          imageName: ghcr.io/stefanprodan/podinfo:6.17.0
          commonUpdateSettings:
            updateStrategy: digest
