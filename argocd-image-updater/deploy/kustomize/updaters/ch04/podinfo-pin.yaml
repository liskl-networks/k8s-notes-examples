# An exact tag: semver holds the image on it, downgrades included.
apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: podinfo
  namespace: argocd
spec:
  applicationRefs:
    - namePattern: podinfo
      images:
        - alias: podinfo
          imageName: ghcr.io/stefanprodan/podinfo:6.15.0
