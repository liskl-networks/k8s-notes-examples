# Credentials for a registry, on one image: a docker-registry Secret in the CR's namespace. The book's Secret
# holds a made-up user and token, so ghcr.io refuses them, though the package is public and needs none.
apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: demo
  namespace: argocd
spec:
  applicationRefs:
    - namePattern: demo
      images:
        - alias: demo
          imageName: ghcr.io/liskl-networks/k8s-notes-examples/image-updater-demo:1.x
          commonUpdateSettings:
            pullSecret: pullsecret:argocd/ghcr-made-up
