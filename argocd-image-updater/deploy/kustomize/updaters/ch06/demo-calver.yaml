# calver: the tag in imageName is the layout.
apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: demo
  namespace: argocd
spec:
  applicationRefs:
    - namePattern: demo
      images:
        - alias: demo
          imageName: ghcr.io/liskl/k8s-notes-examples/image-updater-demo:YYYY.0M.0D
          commonUpdateSettings:
            updateStrategy: calver
