# newest-build over the 1.y.z tags: the newest build wins, not the highest version.
apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: demo
  namespace: argocd
spec:
  applicationRefs:
    - namePattern: demo
      images:
        - alias: demo
          imageName: ghcr.io/liskl/k8s-notes-examples/image-updater-demo
          commonUpdateSettings:
            updateStrategy: newest-build
            allowTags: 'regexp:^1\.'
            platforms: [linux/amd64, linux/arm64]
