# digest on 1.0.0: the tag with the digest it points at now.
apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: demo
  namespace: argocd
spec:
  applicationRefs:
    - namePattern: demo
      images:
        - alias: demo
          imageName: ghcr.io/liskl-networks/k8s-notes-examples/image-updater-demo:1.0.0
          commonUpdateSettings:
            updateStrategy: digest
