# The demo app: the book's own image, which answers "demo <tag>". Image Updater moves this tag in the
# chapters. It runs on one worker, lab-worker2, so the chapter on rebuilt tags can show what that node has
# cached.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels: {app: demo}
  template:
    metadata:
      labels: {app: demo}
    spec:
      nodeSelector:
        kubernetes.io/hostname: lab-worker2
      containers:
        - name: demo
          image: ghcr.io/liskl-networks/k8s-notes-examples/image-updater-demo:1.0.0
          ports:
            - containerPort: 8080
          readinessProbe:
            tcpSocket: {port: 8080}
