# The lab's settings (overlays/kind) plus a registries.conf: one entry for ghcr.io, with a rate limit of its own. The
# controller reads the file once, when it starts, so restart it after a change. A key the file does not know stops it
# from starting at all: the parser is strict.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../kind
patches:
  - target:
      kind: ConfigMap
      name: argocd-image-updater-config
    patch: |
      - op: add
        path: /data/registries.conf
        value: |
          registries:
            - name: GitHub Container Registry
              prefix: ghcr.io
              api_url: https://ghcr.io
              limit: 5
