# This book's root: an app of apps for its own Applications only, beside Field Guide 02's root (which keeps
# Argo CD, the Gateway, kgateway, podinfo and welcome). Through chapter 7 it follows this book's tag,
# read-only: no fork needed. Each chapter moves it to that chapter's hub.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: iu-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/liskl-networks/k8s-notes-examples.git
    targetRevision: argocd-image-updater-1.0
    path: argocd-image-updater/deploy/kustomize/cluster-manifests/overlays/kind-ch06
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
