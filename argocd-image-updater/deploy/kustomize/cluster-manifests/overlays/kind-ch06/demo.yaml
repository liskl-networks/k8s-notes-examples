# The demo app, from this book's folder on the lab branch. Its Git copy sets no kustomize.images: Image
# Updater's argocd write-back adds that field, and the root's diff leaves a field Git never held alone.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/liskl/k8s-notes-examples.git
    targetRevision: argocd-image-updater-1.0
    path: argocd-image-updater/deploy/kustomize/workloads/demo/overlays/kind
  destination:
    server: https://kubernetes.default.svc
    namespace: demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
