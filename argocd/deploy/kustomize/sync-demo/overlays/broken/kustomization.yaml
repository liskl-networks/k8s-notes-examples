# Chapter 6: v2 plus a ConfigMap the API server refuses (names must be lowercase RFC 1123). Every sync of this
# path fails, so auto-sync retries: five times with gaps of 10, 20, 40, 80 and 160 s unless retry says otherwise.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sync-demo
configMapGenerator:
  - name: one
    literals:
      - "message=version two"
  - name: Bad_Name
    literals:
      - "message=never"
generatorOptions:
  disableNameSuffixHash: true
