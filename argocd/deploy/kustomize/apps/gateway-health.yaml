# Chapter 8: a wave that waits on a Gateway nobody claims. Synced by hand: argocd app sync gateway-health
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-health
  namespace: argocd
  labels:
    k8s-notes.liskl.com/source: examples   # the OCI track's Component rewrites repoURL on these
  finalizers:
    - resources-finalizer.argocd.argoproj.io/foreground   # deleting the app deletes what it made
spec:
  project: default
  source:
    repoURL: https://github.com/liskl/k8s-notes-examples.git
    targetRevision: argocd-1.0
    path: argocd/deploy/kustomize/gateway-health/overlays/nope
  destination:
    server: https://kubernetes.default.svc
    namespace: gw-health
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
