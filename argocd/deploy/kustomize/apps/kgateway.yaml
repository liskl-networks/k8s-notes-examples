# Chapter 10: No. 00's Helm release kgateway, rendered by Argo CD. Its Helm release Secrets stay behind:
# helm ls -n kgateway-system still lists it at revision 1. Manual, no finalizer.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kgateway
  namespace: argocd
spec:
  project: default
  source:
    repoURL: cr.kgateway.dev/kgateway-dev/charts   # no scheme: an OCI Helm repository, no Secret
    chart: kgateway
    targetRevision: v2.4.6
    helm:
      releaseName: kgateway   # No. 00's release name, so object names match
  destination:
    server: https://kubernetes.default.svc
    namespace: kgateway-system
