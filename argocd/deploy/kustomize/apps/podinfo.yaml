# Chapter 10: No. 00's podinfo, handed to Argo CD by hand first. Manual, so the page can read the first diff
# (argocd app diff podinfo: the tracking annotation and nothing else) before the sync. No finalizer: deleting
# this Application must never delete No. 00's lab.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: podinfo
  namespace: argocd
  labels:
    k8s-notes.liskl.com/source: examples   # the OCI track's Component rewrites repoURL on these
spec:
  project: default
  source:
    repoURL: https://github.com/liskl/k8s-notes-examples.git
    targetRevision: argocd-1.0
    path: argocd/deploy/kustomize/podinfo/overlays/kind
  destination:
    server: https://kubernetes.default.svc
    namespace: hello
