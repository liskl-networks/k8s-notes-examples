# Chapter 7: automated with prune, selfHeal off, so drift shows and stays until:
#   argocd app set diff-demo --self-heal
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: diff-demo
  namespace: argocd
  labels:
    k8s-notes.liskl.com/source: examples   # the OCI track's Component rewrites repoURL on these
  finalizers:
    - resources-finalizer.argocd.argoproj.io/foreground   # deleting the app deletes what it made
spec:
  project: default
  source:
    repoURL: https://github.com/liskl/k8s-notes-examples.git
    targetRevision: argocd-1.0
    path: argocd/deploy/kustomize/diff-demo/overlays/kind
  destination:
    server: https://kubernetes.default.svc
    namespace: diff-demo
  syncPolicy:
    automated:
      prune: true
    syncOptions:
      - CreateNamespace=true
