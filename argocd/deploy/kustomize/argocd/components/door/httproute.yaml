# The door: http://argocd.localhost:8080 through No. 00's Gateway. argocd-server's own NetworkPolicy admits
# every source, so kgateway's proxy needs no extra policy. The CLI comes in the same way, with --grpc-web.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-server
  namespace: argocd
spec:
  parentRefs:
    - name: http
      namespace: kgateway-system
  hostnames:
    - argocd.localhost
  rules:
    - backendRefs:
        - name: argocd-server
          port: 80
      timeouts:
        request: 0s   # no timeout: Envoy's 15 s default cuts the UI's live streams
