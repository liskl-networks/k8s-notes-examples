# This check replaces the one Argo CD v3.5.6 ships for Gateways (resource_customizations/
# gateway.networking.k8s.io/Gateway/health.lua) completely, so it covers the same cases: Degraded when Accepted or
# ResolvedRefs is False, Progressing until Programmed is True, Healthy after. It adds one: a Gateway still at the
# CRD's default status (Accepted Unknown, reason Pending) reads Degraded, so a wave waiting on it fails instead
# of waiting for ever. Argo CD reads argocd-cm live: no restart.
# Test it offline first:
#   argocd admin settings resource-overrides health gw.yaml --argocd-cm-path argocd-cm.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
data:
  resource.customizations.health.gateway.networking.k8s.io_Gateway: |
    hs = {status = "Progressing", message = "Waiting for Gateway status"}
    if obj.status == nil or obj.status.conditions == nil then
      return hs
    end
    for _, c in ipairs(obj.status.conditions) do
      if (c.type == "Accepted" or c.type == "ResolvedRefs") and c.status == "False" then
        hs.status = "Degraded"
        hs.message = c.message
        return hs
      end
      if c.type == "Accepted" and c.status == "Unknown" and c.reason == "Pending" then
        hs.status = "Degraded"
        hs.message = "no controller owns this Gateway: " .. (c.message or "")
        return hs
      end
    end
    if obj.status.listeners ~= nil then
      for _, l in ipairs(obj.status.listeners) do
        if l.conditions ~= nil then
          for _, c in ipairs(l.conditions) do
            if (c.type == "Accepted" or c.type == "ResolvedRefs") and c.status == "False" then
              hs.status = "Degraded"
              hs.message = "listener " .. l.name .. ": " .. (c.message or "")
              return hs
            end
          end
        end
      end
    end
    for _, c in ipairs(obj.status.conditions) do
      if c.type == "Programmed" then
        if c.status == "True" then
          hs.status = "Healthy"
          hs.message = "Gateway is healthy"
        else
          hs.message = c.message or "Gateway is still being programmed"
        end
        return hs
      end
    end
    return hs
