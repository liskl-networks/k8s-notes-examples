# Argo CD v3.5.6 with the Source Hydrator, exactly as released: source/install-with-hydrator.yaml is
# manifests/install-with-hydrator.yaml at the tag v3.5.6 (commit c2b1e3017e2c), sha256
# c629b2469bb840f209a8652f95b0e144fc5fa0d004f293f12caf002f88a5c2d4. It is bases/v3.5.6 plus the
# argocd-commit-server (ServiceAccount, Service, Deployment, NetworkPolicy) and hydrator.enabled: "true" in
# argocd-cmd-params-cm. Argo CD is Apache-2.0: https://github.com/argoproj/argo-cd/blob/v3.5.6/LICENSE
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
resources:
  - namespace.yaml
  - source/install-with-hydrator.yaml
