# Chapters 10 and 11: Argo CD managing itself. The Application argocd (in the chapter's hub) syncs this folder
# with ServerSideApply=true: the ApplicationSet CRD is too big for a client-side apply.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../bases/v3.5.6
components:
  - ../../components/door
  - ../../components/gateway-health
  - ../../components/self
