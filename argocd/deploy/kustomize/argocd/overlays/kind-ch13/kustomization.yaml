# Chapter 13: kind-ch12 on the hydrator bundle, plus notifications. hydrator.enabled reaches argocd-server and the
# application controller as an environment variable, so after the sync:
#   kubectl -n argocd rollout restart deployment argocd-server
#   kubectl -n argocd rollout restart statefulset argocd-application-controller
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../bases/v3.5.6-hydrator
components:
  - ../../components/door
  - ../../components/gateway-health
  - ../../components/self
  - ../../components/tenants
  - ../../components/notifications
