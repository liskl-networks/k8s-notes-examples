# Wave 0: a ConfigMap. Wave 1: a Deployment and its Service; the sync waits until it is Healthy. Wave 2: a
# ConfigMap that exists only once wave 1 is up.
apiVersion: v1
kind: ConfigMap
metadata:
  name: first
  namespace: waves
  annotations:
    argocd.argoproj.io/sync-wave: "0"
data:
  wave: "0"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: waves
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
        - name: podinfo
          image: ghcr.io/stefanprodan/podinfo:6.15.0
          readinessProbe:
            httpGet:
              path: /readyz
              port: 9898
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: waves
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  selector:
    app: app
  ports:
    - port: 9898
      targetPort: 9898
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: last
  namespace: waves
  annotations:
    argocd.argoproj.io/sync-wave: "2"
data:
  wave: "2"
