# Chapter 11: one preview per open pull request, read at its head commit, deleted when the pull request closes.
# No tokenRef: GitHub's anonymous API, 60 calls an hour per IP, one call per reconcile for each 100 open pull
# requests. On your fork, change owner to your GitHub user and open the pull request there.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: previews
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - pullRequest:
        github:
          owner: liskl
          repo: k8s-notes-examples
        requeueAfterSeconds: 120
  template:
    metadata:
      name: 'preview-{{.number}}'
      finalizers:
        - resources-finalizer.argocd.argoproj.io/foreground
    spec:
      project: default
      source:
        repoURL: https://github.com/liskl/k8s-notes-examples.git
        targetRevision: '{{.head_sha}}'
        path: argocd/deploy/kustomize/previews/base
      destination:
        server: https://kubernetes.default.svc
        namespace: 'preview-{{.number}}'
      syncPolicy:
        automated:
          prune: true
        syncOptions:
          - CreateNamespace=true
