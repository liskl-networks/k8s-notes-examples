# Chapter 12, GIT track: the root Application, one per lab, applied by hand at the start of the chapter:
#   kubectl apply -f argocd/deploy/kustomize/roots/git/kind-ch12.yaml
# It syncs the chapter's hub, one child Application a file. No finalizer: deleting the root leaves everything
# it made. roots/oci/kind-ch12.yaml is the same Application on the other track.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/liskl/k8s-notes-examples.git
    targetRevision: argocd-1.0
    path: argocd/deploy/kustomize/cluster-manifests/overlays/kind-ch12
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
