# The Application chapter 4 made by hand, now in Git with automated sync.
# From chapter 13 it subscribes to the on-synced trigger: one POST to the sink a revision.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: welcome
  namespace: argocd
  labels:
    k8s-notes.liskl.com/source: examples   # the OCI track's Component rewrites repoURL on these
  annotations:
    notifications.argoproj.io/subscribe.on-synced.sink: ""
  finalizers:
    - resources-finalizer.argocd.argoproj.io/foreground   # deleting the app deletes what it made
spec:
  project: default
  source:
    repoURL: https://github.com/liskl/k8s-notes-examples.git
    targetRevision: argocd-1.0
    path: argocd/deploy/kustomize/welcome/overlays/kind
  destination:
    server: https://kubernetes.default.svc
    namespace: welcome
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
