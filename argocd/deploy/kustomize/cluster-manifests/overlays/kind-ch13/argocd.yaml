# Argo CD manages itself from argocd/overlays/kind-ch13. No finalizer, ever: deleting this Application must
# not delete Argo CD. ServerSideApply=true: the ApplicationSet CRD is too big for a client-side apply.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  labels:
    k8s-notes.liskl.com/source: examples   # the OCI track's Component rewrites repoURL on these
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
    argocd.argoproj.io/compare-options: ServerSideDiff=true   # with ServerSideApply=true, or defaulted fields read OutOfSync
spec:
  project: default
  source:
    repoURL: https://github.com/liskl/k8s-notes-examples.git
    targetRevision: argocd-1.0
    path: argocd/deploy/kustomize/argocd/overlays/kind-ch13
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
