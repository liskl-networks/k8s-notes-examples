# What kubectl expose deployment podinfo --port 9898 made, written out in full: protocol and targetPort are the
# values the API server defaulted, so taking the Service over changes nothing.
apiVersion: v1
kind: Service
metadata:
  name: podinfo
  namespace: hello
spec:
  type: ClusterIP
  selector:
    app: podinfo
  ports:
    - port: 9898
      protocol: TCP
      targetPort: 9898
