# Where to send: the lab's echo sink. generic POSTs each event as JSON. Flux 2.9 serves Provider and Alert as
# v1beta3 only; 2.10 adds v1.
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Provider
metadata:
  name: sink
  namespace: flux-system
spec:
  type: generic
  address: http://echo.sink.svc.cluster.local:8080/
