# What to send: every event, info and error, from the objects this book deploys. An Alert reads one
# namespace per entry, so each namespace with something in it gets a line.
apiVersion: notification.toolkit.fluxcd.io/v1
kind: Alert
metadata:
  name: lab
  namespace: flux-system
spec:
  providerRef:
    name: sink
  eventSeverity: info
  eventSources:
    - kind: FluxInstance
      name: flux
    - kind: Kustomization
      name: "*"
    - kind: HelmRelease
      name: "*"
      namespace: podinfo-helm
    - kind: HelmRelease
      name: "*"
      namespace: podinfo-auto
    - kind: ResourceSet
      name: "*"
      namespace: podinfo-auto
