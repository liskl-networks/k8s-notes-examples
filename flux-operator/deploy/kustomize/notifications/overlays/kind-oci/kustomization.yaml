# Chapter 11 on the OCI track: the same, with the Receiver poking the OCIRepository instead.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../kind
patches:
  - target:
      kind: Receiver
      name: lab-hook
    patch: |
      - op: replace
        path: /spec/resources/0/kind
        value: OCIRepository
