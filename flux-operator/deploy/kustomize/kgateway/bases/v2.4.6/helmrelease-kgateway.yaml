# No values: No. 00 set none. disableTakeOwnership makes a wrong releaseName fail loudly instead of installing a
# second controller that takes the first one's cluster-wide RBAC.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kgateway
  namespace: kgateway-system
spec:
  interval: 1h
  releaseName: kgateway
  storageNamespace: kgateway-system
  dependsOn:
    - name: kgateway-crds
  chartRef:
    kind: OCIRepository
    name: kgateway
  install:
    disableTakeOwnership: true
