# Who helm-controller is when it installs kgateway once the cluster is multi-tenant. kgateway's charts make
# CRDs and ClusterRoles, so this one is bound to cluster-admin (the platform's choice, not a tenant's).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flux-platform
  namespace: kgateway-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: flux-platform-kgateway-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: flux-platform
    namespace: kgateway-system
