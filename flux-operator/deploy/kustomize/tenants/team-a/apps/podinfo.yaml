# Team A's app: one podinfo, in team-a's own namespace, applied as team-a.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: podinfo
  namespace: team-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: podinfo
  template:
    metadata:
      labels:
        app: podinfo
    spec:
      containers:
        - name: podinfo
          image: ghcr.io/stefanprodan/podinfo:6.15.0
          env:
            - name: PODINFO_UI_MESSAGE
              value: "team-a deployed this with team-a's rights."
---
apiVersion: v1
kind: Service
metadata:
  name: podinfo
  namespace: team-a
spec:
  selector:
    app: podinfo
  ports:
    - port: 9898
