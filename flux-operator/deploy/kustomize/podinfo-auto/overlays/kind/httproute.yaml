# Through No. 00's Gateway: curl http://podinfo-auto.localhost:8080/
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: podinfo
  namespace: podinfo-auto
spec:
  parentRefs:
    - name: http
      namespace: kgateway-system
  hostnames:
    - podinfo-auto.localhost
  rules:
    - backendRefs:
        - name: podinfo
          port: 9898
