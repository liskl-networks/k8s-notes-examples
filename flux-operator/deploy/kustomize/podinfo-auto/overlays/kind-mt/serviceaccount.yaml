# Who helm-controller is for this release once the cluster is multi-tenant: admin of this namespace only.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flux-platform
  namespace: podinfo-auto
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flux-platform
  namespace: podinfo-auto
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
subjects:
  - kind: ServiceAccount
    name: flux-platform
    namespace: podinfo-auto
