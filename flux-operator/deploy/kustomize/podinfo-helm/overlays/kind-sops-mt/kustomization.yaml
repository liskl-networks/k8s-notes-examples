# Chapter 12: chapter 8's podinfo-helm, its HelmRelease run as flux-platform.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../kind-sops
  - serviceaccount.yaml
patches:
  - target:
      kind: HelmRelease
      name: podinfo
    patch: |
      - op: add
        path: /spec/serviceAccountName
        value: flux-platform
