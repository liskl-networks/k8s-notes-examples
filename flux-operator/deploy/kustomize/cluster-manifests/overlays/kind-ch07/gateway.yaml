# The lab's door. A Gateway has no Ready condition, so the health check is written out: healthy once Programmed.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gateway
  namespace: flux-system
spec:
  dependsOn:
    - name: kgateway
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: flux-operator/deploy/kustomize/gateway/overlays/kind
  prune: true
  wait: true
  healthCheckExprs:
    - apiVersion: gateway.networking.k8s.io/v1
      kind: Gateway
      current: has(status.conditions) && status.conditions.exists(c, c.type == 'Programmed' && c.status == 'True')
