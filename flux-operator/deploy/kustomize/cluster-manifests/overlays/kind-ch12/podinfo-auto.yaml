# Chapter 12: chapter 9's child, on the overlay that gives the HelmRelease it renders its own identity.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: podinfo-auto
  namespace: flux-system
spec:
  dependsOn:
    - name: gateway
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: flux-operator/deploy/kustomize/podinfo-auto/overlays/kind-mt
  prune: true
  wait: true
