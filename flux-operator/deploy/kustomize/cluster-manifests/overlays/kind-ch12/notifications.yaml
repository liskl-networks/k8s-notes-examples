# Chapter 12: notifications on a multi-tenant cluster, an Alert in each namespace with releases. After
# podinfo-helm and podinfo-auto as well, whose namespaces those Alerts live in.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: notifications
  namespace: flux-system
spec:
  dependsOn:
    - name: gateway
    - name: sink
    - name: podinfo-helm
    - name: podinfo-auto
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: flux-operator/deploy/kustomize/notifications/overlays/kind-mt
  prune: true
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
