# Chapter 8: the same child, on the overlay with the encrypted values. decryption is set on the Kustomization
# that applies the encrypted file, and it reads the age key from Secret sops-age, which you make by hand
# (no Git path ever holds a real key).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: podinfo-helm
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: flux-operator/deploy/kustomize/podinfo-helm/overlays/kind-sops
  prune: true
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
