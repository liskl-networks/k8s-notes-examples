# Chapter 13: the Web UI's route and the one NetworkPolicy it needs. After the gateway, for the HTTPRoute.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-ui
  namespace: flux-system
spec:
  dependsOn:
    - name: gateway
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: flux-operator/deploy/kustomize/flux-ui/overlays/kind
  prune: true
  wait: true
