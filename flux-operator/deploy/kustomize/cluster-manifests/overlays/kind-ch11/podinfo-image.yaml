# Chapter 10: podinfo with its image tag kept in Git by Flux's image automation. After the gateway, for its
# HTTPRoute.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: podinfo-image
  namespace: flux-system
spec:
  dependsOn:
    - name: gateway
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: flux-operator/deploy/kustomize/podinfo-image/overlays/kind
  prune: true
  wait: true
