# The hub for the OCI track: the Git track's hub, with every Flux Kustomization reading the OCI artifact instead.
# The artifact holds this repo's flux-operator/ folder at the same path, so every spec.path stays as it is.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../kind
patches:
  - target:
      group: kustomize.toolkit.fluxcd.io
      kind: Kustomization
    patch: |
      - op: replace
        path: /spec/sourceRef/kind
        value: OCIRepository
