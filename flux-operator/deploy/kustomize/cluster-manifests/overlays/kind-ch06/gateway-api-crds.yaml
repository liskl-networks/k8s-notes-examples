# The first layer: nothing else on the lab can apply until these CRDs are Established (wait: true).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gateway-api-crds
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: flux-operator/deploy/kustomize/gateway-api-crds/bases/v1.6.3
  prune: true
  wait: true
