# Chapter 6: chapter 5's hub plus No. 00's lab, in layers: gateway-api-crds -> kgateway -> gateway -> podinfo.
# One Flux Kustomization a file, the file named after metadata.name. Order comes from dependsOn inside
# each one, never from this list. Taking a line out of this list deletes what it deployed (prune: true).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - welcome.yaml
  - podinfo-helm.yaml
  - gateway-api-crds.yaml
  - kgateway.yaml
  - gateway.yaml
  - podinfo.yaml
