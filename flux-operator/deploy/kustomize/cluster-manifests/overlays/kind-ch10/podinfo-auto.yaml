# Chapter 9: podinfo on the newest 6.x chart, chosen in the cluster by a ResourceSetInputProvider. After the
# gateway, for its HTTPRoute. wait reaches the HelmRelease through the ResourceSet, whose own wait is on.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: podinfo-auto
  namespace: flux-system
spec:
  dependsOn:
    - name: gateway
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: flux-operator/deploy/kustomize/podinfo-auto/overlays/kind
  prune: true
  wait: true
