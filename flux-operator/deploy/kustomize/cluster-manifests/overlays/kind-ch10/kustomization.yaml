# Chapter 10: chapter 9's hub plus podinfo-image and the image automation that commits its tag to Git.
# One Flux Kustomization a file, the file named after metadata.name. Order comes from dependsOn inside
# each one, never from this list. Taking a line out of this list deletes what it deployed (prune: true).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - podinfo-helm.yaml
  - gateway-api-crds.yaml
  - kgateway.yaml
  - gateway.yaml
  - podinfo.yaml
  - podinfo-auto.yaml
  - podinfo-image.yaml
  - image-automation.yaml
