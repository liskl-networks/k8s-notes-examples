# Chapter 10 only: the automation that commits new image tags to Git. It needs Secret examples-write (a deploy
# key that may push, made by hand), so later chapters' hubs leave it out.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: image-automation
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: flux-operator/deploy/kustomize/image-automation/overlays/kind
  prune: true
  wait: true
