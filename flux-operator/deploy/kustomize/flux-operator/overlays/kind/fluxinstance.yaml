# Flux 2.10.x: the highest 2.10 that operator v0.62.0 carries (2.10.0 when it was released).
# Sync: this repo over anonymous HTTPS, the hub for the Git track.
apiVersion: fluxcd.controlplane.io/v1
kind: FluxInstance
metadata:
  name: flux
  namespace: flux-system
spec:
  distribution:
    version: "2.10.x"
    registry: ghcr.io/fluxcd
  components:
    - source-controller
    - kustomize-controller
    - helm-controller
    - notification-controller
    - image-reflector-controller
    - image-automation-controller
  cluster:
    type: kubernetes
    size: small
    networkPolicy: true
  sync:
    kind: GitRepository
    url: https://github.com/liskl/k8s-notes-examples.git
    ref: refs/heads/main
    path: flux-operator/deploy/kustomize/cluster-manifests/overlays/kind
