# Chapter 13: the instance of overlays/kind-oci, synced to the hub kind-oci-ch13.
# kubectl apply --server-side -k flux-operator/deploy/kustomize/flux-operator/overlays/kind-oci-ch13
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../kind-oci
patches:
  - target:
      kind: FluxInstance
      name: flux
    patch: |
      - op: replace
        path: /spec/sync/path
        value: flux-operator/deploy/kustomize/cluster-manifests/overlays/kind-oci-ch13
