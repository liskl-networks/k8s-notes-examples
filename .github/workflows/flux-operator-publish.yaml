# Publishes the flux-operator/ folder as an OCI artifact on ghcr.io, signed keyless with cosign, for the OCI track
# of Field Guide 01. The artifact keeps the folder's own prefix, so every Flux path is the same in both tracks.
#
#   ghcr.io/liskl/k8s-notes-examples/flux-operator:<short sha>   one tag a commit
#   ghcr.io/liskl/k8s-notes-examples/flux-operator:latest        moved to the newest one
#
# Flux checks the signature against this file on main: the certificate's subject is
#   https://github.com/liskl/k8s-notes-examples/.github/workflows/flux-operator-publish.yaml@refs/heads/main
name: flux-operator-publish
on:
  push:
    branches: [main]
    paths:
      - 'flux-operator/**'
      - '.github/workflows/flux-operator-publish.yaml'
  workflow_dispatch: {}
concurrency:
  group: flux-operator-publish
  cancel-in-progress: false
permissions:
  contents: read
  packages: write   # push to ghcr.io with the workflow's GITHUB_TOKEN
  id-token: write   # the GitHub OIDC token cosign signs with (keyless)
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      OCI_REPO: oci://ghcr.io/${{ github.repository }}/flux-operator
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: fluxcd/flux2/action@3fa784edd773d56630bb9f62645e08f70c2cff0a # v2.10.0
        with:
          version: 2.10.0
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Stage the folder at its own path
        run: mkdir -p "$RUNNER_TEMP/artifact" && cp -r flux-operator "$RUNNER_TEMP/artifact/"
      - name: Push, sign, tag latest
        run: |
          tag="${GITHUB_SHA::7}"
          ref=$(flux push artifact "$OCI_REPO:$tag" \
            --path="$RUNNER_TEMP/artifact" \
            --source="https://github.com/${GITHUB_REPOSITORY}" \
            --revision="${GITHUB_REF_NAME}@sha1:${GITHUB_SHA}" \
            --output=json | jq -r '.repository + "@" + .digest')
          echo "pushed $ref"
          cosign sign --yes "$ref"
          flux tag artifact "$OCI_REPO:$tag" --tag latest
